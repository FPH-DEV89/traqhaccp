<!DOCTYPE html>
<html lang="fr-FR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TraqHACCP — Registre sanitaire</title>
<meta name="description" content="Registre sanitaire HACCP hors-ligne : températures, nettoyage, huiles de friture, traçabilité, non-conformités et audits.">
<meta name="color-scheme" content="light">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/favicon.svg">
<link rel="manifest" href="manifest.json">

<!-- Design system : l'ordre des feuilles compte (tokens → base → layout → composants → vues). -->
<link rel="stylesheet" href="css/tokens.css?v=4.2.0">
<link rel="stylesheet" href="css/base.css?v=4.2.0">
<link rel="stylesheet" href="css/layout.css?v=4.2.0">
<link rel="stylesheet" href="css/components.css?v=4.2.0">
<link rel="stylesheet" href="css/views.css?v=4.2.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">

<!-- Signalétique sonore des alertes sanitaires (dégradation silencieuse hors-ligne). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js" defer></script>
</head>

<body>
<a class="skip-link" href="#main">Aller au contenu principal</a>

<!-- Coquille v4 : le rail, la barre supérieure et la barre d'onglets sont injectés par
     src/presentation/shell.js ; la vue courante par src/presentation/router.js. -->
<div class="app">
  <nav id="rail" class="rail" aria-label="Navigation principale"></nav>

  <div class="workspace">
    <header id="topbar" class="topbar"></header>
    <main id="main" class="main">
      <div id="view" class="view" role="region" aria-live="polite"></div>
    </main>
    <nav id="tabbar" class="tabbar" aria-label="Navigation rapide"></nav>
  </div>
</div>

<noscript>
  <p class="callout callout--warn">TraqHACCP a besoin de JavaScript pour afficher le registre sanitaire et enregistrer les relevés.</p>
</noscript>

<script type="module">
  import { boot } from './src/presentation/context.js';
  boot();

  // PWA : le registre doit rester consultable hors-ligne (harnais réseau dégradé).
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      if (reg && reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
    }).catch(() => {});
    let rechargement = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!rechargement) {
        rechargement = true;
        window.location.reload();
      }
    });
  }
</script>
</body>
</html>
