name: TraqHACCP CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Lint, Norms & Domain Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Quality and HACCP Gates
        run: npm test

      - name: Check Gates (CSS cascade, fresh artifacts)
        run: npm run gate:css
